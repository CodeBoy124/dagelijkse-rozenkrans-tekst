<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dagelijkse Rozenkrans tekst</title>
    <link rel="stylesheet" href="style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Edu+NSW+ACT+Cursive:wght@400..700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main>
      <button id="copy" onclick="copyContents()">
        Kopieer
        <div id="handle"></div>
      </button>
      <div id="actions">
        <a id="link-overzicht" href="#"
          ><button id="action-overzicht">Overzicht</button></a
        >
        <a id="link-volledig" href="#"
          ><button id="action-volledig">Volledig</button></a
        >
      </div>
      <div id="text-container">
        <p id="text1"></p>
        <textarea
          id="prayer-intentions"
          rows="5"
          placeholder="<Gebedsintenties>"
        ></textarea>
        <p id="text2"></p>
      </div>
    </main>
    <script src="./js/params.js"></script>
    <script src="./js/elements.js"></script>
    <script src="./js/util.js"></script>
    <script src="./js/constants.js"></script>
    <script src="./js/main.js"></script>
  </body>
</html>
